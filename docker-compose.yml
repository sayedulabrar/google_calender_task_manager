services:

  # ====================== INIT (Docker bootstrap only) ======================
  backend-init:
    build:
      context: ./task-manager-api
      dockerfile: Dockerfile
      args:
        user: reportuser
        uid: 1000
    container_name: reporting-backend-init
    working_dir: /var/www
    volumes:
      - ./task-manager-api:/var/www
    depends_on:
      database_set:
        condition: service_healthy   # ✅ Wait until MySQL is actually ready
    networks:
      - app-network

    command: >
      sh -c "
      composer install --no-interaction --optimize-autoloader &&
      if [ ! -f .env.keyed ]; then
          php artisan key:generate --force &&
          touch .env.keyed;
      fi &&
      php artisan migrate --force
      "

  # ====================== BACKEND ======================
  backend-app:
    build:
      context: ./task-manager-api
      dockerfile: Dockerfile
      args:
        user: reportuser
        uid: 1000
    container_name: reporting-backend-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./task-manager-api:/var/www
    ports:
      - "8000:8000"
    depends_on:
      database_set:
        condition: service_healthy   # ✅ Wait until MySQL is actually ready
      backend-init:
        condition: service_completed_successfully  # ✅ Wait until migrations finish
    networks:
      - app-network
    command: php artisan serve --host=0.0.0.0 --port=8000

  # ====================== DATABASE ======================
  database_set:
    image: mysql:5.7
    container_name: reporting-database
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ====================== PHPMYADMIN ======================
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: reporting-phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: database_set        # ✅ Fixed: was "database", must match service name
      PMA_USER: ${DB_USERNAME}
      PMA_PASSWORD: ${DB_PASSWORD}
    depends_on:
      database_set:
        condition: service_healthy
    networks:
      - app-network

  # ====================== FRONTEND ======================
  frontend:
    build:
      context: ./task-manager-ui
      dockerfile: Dockerfile
    container_name: reporting-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./task-manager-ui:/app
      - /app/node_modules
    depends_on:
      - backend-app
    networks:
      - app-network
    command: npm run dev -- --host 0.0.0.0 --port 5173

# ====================== NETWORKS ======================
networks:
  app-network:
    driver: bridge

# ====================== VOLUMES ======================
volumes:
  db-data: